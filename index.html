<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assam history character sheets</title>
<meta name="description" content="Character sheets for the people of Assam's history, from Pushyavarman to Tarun Gogoi, to use as reference for AI images, video and books.">
<link rel="icon" href="favicon.svg">
<meta name="theme-color" content="#e9e1cc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap">
<link rel="stylesheet" href="app.css">
<script defer src="data/site.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="#/" aria-label="Assam history character sheets, home"><span class="brand-mark" aria-hidden="true"></span><span id="brandName">Assam history sheets</span></a>
  <nav id="nav" aria-label="Main"></nav>
  <div class="tools">
    <button id="langBtn" type="button" class="quiet" aria-label="Switch language">অসমীয়া</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="foot">
  <div class="weave" aria-hidden="true"></div>
  <p id="footNote"></p>
</footer>

<dialog id="viewer" aria-label="Image viewer">
  <div class="vbar">
    <div class="vtitle"><strong id="vTitle"></strong><span id="vSub"></span></div>
    <div class="vact">
      <button type="button" id="vZoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="vZoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="vFit">Fit</button>
      <a id="vDownload" class="btn" download>Download</a>
      <button type="button" id="vClose">Close</button>
    </div>
  </div>
  <div class="vstage" id="vStage"><img id="vImg" alt="" draggable="false"></div>
  <button type="button" class="vnav prev" id="vPrev" aria-label="Previous image">‹</button>
  <button type="button" class="vnav next" id="vNext" aria-label="Next image">›</button>
  <div class="vfoot" id="vFoot"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
